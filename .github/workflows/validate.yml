name: Validate research repository

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests
      - name: Validate data lineage and file limits
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/validate_repository.py
      - name: Validate input readiness and deterministic pipeline plan
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/run_daily_pipeline.py --dry-run
      - name: Audit end-to-end completion evidence
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/audit_system_completion.py
